<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Hall</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar">
    <a class="logo" href="index.html">💍 WedVenue</a>
    <nav><a href="index.html">Home</a><a href="halls.html">Halls</a><a href="booking.html">Book Hall</a><a href="payments.html">Payments</a><a href="admin.html">Admin</a></nav>
</header>

<main class="section">
<div class="form-wrap">
<div class="section-title left">
<span class="eyebrow">RESERVATION</span>
<h1>Book Your Wedding Hall</h1>
<p>Enter customer and event details to create a booking.</p>
</div>

<form id="bookingForm" class="form-card">
<h3>Customer Details</h3>
<div class="form-grid">
<label>Name<input id="name" required></label>
<label>Email<input id="email" type="email" required></label>
<label>Phone<input id="phone" required></label>
<label>Address<input id="address"></label>
</div>

<h3>Event Details</h3>
<div class="form-grid">
<label>Hall<select id="hall_id" required></select></label>
<label>Event Name<input id="event_name" placeholder="Wedding / Reception / Birthday" required></label>
<label>Event Date<input id="event_date" type="date" required></label>
<label>Start Time<input id="start_time" type="time" required></label>
<label>End Time<input id="end_time" type="time" required></label>
</div>

<div class="total-box">Estimated Hall Price: <strong id="total_amount">₹0.00</strong></div>
<button class="btn" type="submit">Confirm Booking</button>
<div id="message"></div>
</form>
</div>
</main>
<footer>© 2026 WedVenue</footer>
<script src="js/booking.js"></script>
</body>
</html>
